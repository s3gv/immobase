# CLA enforcement for ImmoBase.
#
# Asks every contributor to accept the Contributor License Agreement (CLA.md)
# on their pull request, and records the acceptance in a signature register on
# the orphan branch `cla-signatures`.
#
# ---------------------------------------------------------------------------
# SECURITY: why this workflow uses `pull_request_target`
# ---------------------------------------------------------------------------
# `pull_request_target` runs in the context of the BASE repository with a
# read/write GITHUB_TOKEN, even for pull requests from forks. The action needs
# that, because it has to commit the signature file — with a plain
# `pull_request` trigger, fork PRs get a read-only token and the CLA check
# could never work for exactly the contributors it exists for.
#
# This is only safe because THIS WORKFLOW NEVER CHECKS OUT OR EXECUTES PULL
# REQUEST CODE. There is deliberately no `actions/checkout` step here.
#
# If you ever add a checkout step, a build step, or anything that runs code
# from the pull request, you hand a write-scoped token to untrusted code.
# Don't. Put that work in a separate workflow triggered by `pull_request`.
# ---------------------------------------------------------------------------

name: CLA

on:
  pull_request_target:
    types: [opened, synchronize, closed]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    # Only react to the signature sentence, to `recheck`, or to pull request
    # events. Every other comment on a PR is ignored.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null &&
       (github.event.comment.body == 'recheck' ||
        contains(github.event.comment.body, 'I have read the ImmoBase Contributor License Agreement v1.0 and I hereby sign it')))
    steps:
      - name: CLA Assistant
        # Pinned to the commit behind v2.6.1. Update deliberately, never with a
        # floating tag — this action runs with a write-scoped token.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Signature register. The version segment tracks the CLA version:
          # a substantive change to CLA.md bumps both, which makes the action
          # ask everyone to accept the new text once.
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/s3gv/immobase/blob/main/CLA.md
          branch: cla-signatures

          # The maintainer is the copyright holder and does not sign his own
          # CLA. Bots cannot agree to a contract.
          # Companies that have signed CLA-CORPORATE.md get their designated
          # accounts added here — see CONTRIBUTING.md.
          allowlist: s3gv,*[bot]

          create-file-commit-message: "chore(cla): record CLA signature"
          signed-commit-message: "chore(cla): $contributorName signed the CLA in #$pullRequestNo"

          custom-notsigned-prcomment: |
            Thanks for your pull request — before it can be merged, we need you to accept the ImmoBase **Contributor License Agreement**.

            **Why:** ImmoBase is AGPLv3 and follows an open-core model. The CLA lets the maintainer offer commercial licenses alongside the open source version — and it binds him to keep licensing your contribution under AGPLv3 too, so your work can never be taken closed. You keep the copyright in everything you write.

            Please read **[CLA.md](https://github.com/s3gv/immobase/blob/main/CLA.md)** (the plain-language explanation, also in German, is in [CONTRIBUTING.md](https://github.com/s3gv/immobase/blob/main/CONTRIBUTING.md)), then reply on this pull request with exactly:
          custom-pr-sign-comment: I have read the ImmoBase Contributor License Agreement v1.0 and I hereby sign it.
          custom-allsigned-prcomment: |
            All contributors on this pull request have accepted the CLA. Thank you — your signature is recorded and you will not be asked again.
