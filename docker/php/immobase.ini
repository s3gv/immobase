;
; Was ImmoBase an PHP-Vorgaben ändert — und nur das.
;
; Eine Nachricht im Mieterportal darf fünf Dateien zu je fünf Megabyte
; tragen. PHPs Vorgaben (2 MB je Datei, 8 MB je Anfrage) schneiden davon das
; meiste ab, und zwar **ohne Fehlermeldung**: PHP verwirft die Dateien, der
; Ablauf läuft weiter, und der Absender sieht eine Nachricht ohne Anhang.
;
; 30 MB ist die Grenze mit Luft für das Formular drumherum. Bewusst nicht mehr:
; die Grenzen dienen der Anwendung und nicht dem Hochladen von Videos.
upload_max_filesize = 30M
post_max_size = 30M
max_file_uploads = 20

; Keine PHP-Version in den Antwortkoepfen: sie verraet, gegen welche bekannten
; Luecken sich ein Angriff lohnt.
expose_php = Off
