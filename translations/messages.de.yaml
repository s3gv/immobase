# Der Rechtekatalog. Bezeichnung und Erklärung stehen in der Matrix, auf der
# Kontoseite und unter "Meine Rechte" — ein Recht, das nur als Schlüssel
# dasteht, ist für den Menschen davor keines. Ein Test lässt den Lauf
# fehlschlagen, wenn eines von beiden fehlt.
permission:
  audit:
    view:
      label: 'Protokoll ansehen'
      explanation: 'Zeigt, wer wann was geändert, gelöscht oder sich angemeldet hat — die letzten 48 Stunden. Das Protokoll lässt sich nicht bearbeiten, nur lesen und sichern.'
  action:
    view: 'Anzeigen'
    edit: 'Bearbeiten'
    delete: 'Löschen'
  area:
    parties: 'Stammdaten'
    users: 'Benutzer'
    roles: 'Rollen und Rechte'
    settings: 'Einstellungen'
    properties: 'Objekte'
    tenancies: 'Miete'
    finance: 'Finanzen'
    billing: 'Billing'
    dunning: 'Mahnwesen'
    enquiries: 'Anfragen'
    audit: 'Protokoll'
  enquiries:
    view:
      label: 'Anfragen anzeigen'
      explanation: 'Die Anfragen aus dem Mieterportal lesen — samt der Anhänge, solange sie nicht abgelaufen sind.'
    edit:
      label: 'Anfragen bearbeiten'
      explanation: 'Antworten, Bearbeiter zuweisen und Anfragen als erledigt markieren. Wer antwortet, spricht mit seinem Namen nach draußen.'
  parties:
    view:
      label: 'Stammdaten anzeigen'
      explanation: 'Die Übersicht und die Detailseiten von Mietern, Eigentümern und sonstigen Kontakten öffnen.'
    edit:
      label: 'Stammdaten bearbeiten'
      explanation: 'Kontakte anlegen, ändern und archivieren. Archivieren entfernt nichts, es räumt aus dem Weg.'
    delete:
      label: 'Stammdaten löschen'
      explanation: 'Einen Kontakt endgültig entfernen. Nur möglich, solange kein Vorgang auf ihn verweist.'
  users:
    view:
      label: 'Benutzer anzeigen'
      explanation: 'Die Benutzerübersicht und die Kontoseiten der Kolleginnen und Kollegen öffnen — samt ihrer Adressen.'
    edit:
      label: 'Benutzer verwalten'
      explanation: 'Einladen, deaktivieren, den zweiten Faktor zurücksetzen sowie Rollen und Zusatzrechte vergeben. Wer das darf, kann jedes weitere Recht weiterreichen.'
    delete:
      label: 'Benutzer löschen'
      explanation: 'Ein Konto endgültig entfernen. Das letzte Konto, das noch Benutzer verwalten kann, bleibt geschützt.'
  roles:
    view:
      label: 'Rollen und Rechte anzeigen'
      explanation: 'Die Rollen dieser Installation und die Rechtematrix ansehen.'
    edit:
      label: 'Rollen und Rechte bearbeiten'
      explanation: 'Rollen anlegen, umbenennen und die Matrix speichern — also festlegen, was eine Rolle darf.'
    delete:
      label: 'Rollen löschen'
      explanation: 'Eine Rolle entfernen. Nur möglich, solange ihr kein Konto zugeordnet ist.'
  dunning:
    view:
      label: 'Mahnwesen anzeigen'
      explanation: 'Die verfolgten Forderungen, ihre Zinsen und die ausgestellten Mahnschreiben ansehen.'
    edit:
      label: 'Mahnwesen bearbeiten'
      explanation: 'Forderungen anlegen und erledigen, Mahnschreiben ausstellen und die Basiszinssätze pflegen. Eine Mahnung ist eine Rechtsfolge — wer sie auslöst, soll das ausdrücklich dürfen.'
  billing:
    view:
      label: 'Abrechnungen anzeigen'
      explanation: 'Die Übersicht, die Liste und jede erzeugte Abrechnung öffnen — samt der Beträge, die einzelne Eigentümer und Mieter betreffen.'
    edit:
      label: 'Abrechnungen erstellen'
      explanation: 'Abrechnungen anlegen, prüfen und freigeben. Die Freigabe ist unumkehrbar: ab da ist die Abrechnung Post, und was daran nicht stimmt, wird korrigiert statt überschrieben.'
  finance:
    view:
      label: 'Finanzen anzeigen'
      explanation: 'Kostenpositionen, Vorauszahlungen, Verteilerschlüssel und den Stand der Erhaltungsrücklage ansehen.'
    edit:
      label: 'Finanzen bearbeiten'
      explanation: 'Kostenpositionen und Vorauszahlungen erfassen und ändern, Verteilerschlüssel und Kostenarten pflegen, Rücklagenbewegungen buchen.'
    delete:
      label: 'Finanzen löschen'
      explanation: 'Eine Kostenposition oder eine Rücklagenbewegung endgültig entfernen. Nur möglich, solange keine Abrechnung darauf verweist.'
  tenancies:
    view:
      label: 'Miete ansehen'
      explanation: 'Die Übersicht der Mietverhältnisse und die einzelnen Mietseiten öffnen — mit Mietern, Beträgen und Kaution.'
    edit:
      label: 'Miete bearbeiten'
      explanation: 'Mietverhältnisse anlegen und ändern, Mieter zuordnen, die Mietstaffel pflegen und ein Mietverhältnis beenden.'
    delete:
      label: 'Miete löschen'
      explanation: 'Ein Mietverhältnis endgültig entfernen. Möglich, solange nichts daran hängt — sonst bleibt nur beenden.'
  properties:
    view:
      label: 'Objekte anzeigen'
      explanation: 'Die Objektübersicht, die Objektseiten und ihre Einheiten öffnen.'
    edit:
      label: 'Objekte bearbeiten'
      explanation: 'Objekte anlegen und ändern, Einheiten pflegen und Eigentümer zuordnen.'
    delete:
      label: 'Objekte löschen'
      explanation: 'Ein Objekt oder eine Einheit endgültig entfernen. Bei einem Objekt verschwinden seine Einheiten mit.'
  settings:
    view:
      label: 'Einstellungen anzeigen'
      explanation: 'Die Einstellungen dieser Installation ansehen.'
    edit:
      label: 'Einstellungen ändern'
      explanation: 'Die Einstellungen dieser Installation speichern.'

