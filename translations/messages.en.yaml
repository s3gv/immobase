    view:
      label: 'View enquiries'
      explanation: 'Read the enquiries from the tenant portal — including their attachments, as long as these have not expired.'
    edit:
      label: 'Work on enquiries'
      explanation: 'Reply, assign an owner and mark enquiries as closed. Whoever replies speaks outwards under their own name.'
