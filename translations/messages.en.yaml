    view:
      label: 'View contacts'
      explanation: 'Open the list and the detail pages of tenants, owners and other contacts.'
    edit:
      label: 'Edit contacts'
      explanation: 'Create, change and archive contacts. Archiving removes nothing, it moves things out of the way.'
    delete:
      label: 'Delete contacts'
      explanation: 'Remove a contact for good. Only possible while nothing else refers to it.'
  users:
    view:
      label: 'View users'
      explanation: 'Open the user list and your colleagues account pages — including their addresses.'
    edit:
      label: 'Manage users'
      explanation: 'Invite, deactivate, reset the second factor, and assign roles and extra permissions. Whoever may do this can pass on every other permission.'
    delete:
      label: 'Delete users'
      explanation: 'Remove an account for good. The last account that can still manage users stays protected.'
  roles:
    view:
      label: 'View roles and permissions'
      explanation: 'See the roles of this installation and the permission matrix.'
    edit:
      label: 'Edit roles and permissions'
      explanation: 'Create and rename roles and save the matrix — that is, decide what a role may do.'
    delete:
      label: 'Delete roles'
      explanation: 'Remove a role. Only possible while no account is assigned to it.'
  dunning:
    view:
      label: 'View dunning'
      explanation: 'See the tracked claims, their interest and the dunning letters that have been issued.'
    edit:
      label: 'Manage dunning'
      explanation: 'Record and settle claims, issue dunning letters and maintain the base rates. A dunning letter has legal consequences — whoever triggers one should be allowed to explicitly.'
  billing:
    view:
      label: 'View statements'
      explanation: 'Open the overview, the list and every statement produced — including the amounts that concern individual owners and tenants.'
    edit:
      label: 'Create statements'
      explanation: 'Create, check and release statements. Releasing is irreversible: from then on the statement is post, and what is wrong with it gets corrected rather than overwritten.'
  finance:
    view:
      label: 'View finances'
      explanation: 'See cost items, advance payments, distribution keys and the balance of the maintenance reserve.'
    edit:
      label: 'Edit finances'
      explanation: 'Record and change cost items and advance payments, maintain distribution keys and cost types, book reserve movements.'
    delete:
      label: 'Delete finances'
      explanation: 'Remove a cost item or a reserve movement for good. Possible while no statement refers to it.'
  tenancies:
    view:
      label: 'View tenancies'
      explanation: 'Open the tenancy list and the individual tenancy pages — with tenants, amounts and deposit.'
    edit:
      label: 'Edit tenancies'
      explanation: 'Create and change tenancies, assign tenants, maintain the rent schedule and end a tenancy.'
    delete:
      label: 'Delete tenancies'
      explanation: 'Remove a tenancy for good. Possible while nothing depends on it — otherwise only ending it remains.'
  properties:
    view:
      label: 'View properties'
      explanation: 'Open the property list, the property pages and their units.'
    edit:
      label: 'Edit properties'
      explanation: 'Create and change properties, maintain units and assign owners.'
    delete:
      label: 'Delete properties'
      explanation: 'Remove a property or a unit for good. Deleting a property takes its units with it.'
  settings:
    view:
      label: 'View settings'
      explanation: 'See the settings of this installation.'
    edit:
      label: 'Change settings'
      explanation: 'Save the settings of this installation.'

